# ~/.gemini/antigravity-cli/agy-neo.conf
#
# Prompt-cache warm-up policy for agy-neo (hub-wrapper.sh, cache_relay.py, statusline.sh).
# Installed once by `python3 patch_agy.py --apply` and never overwritten on later applies.
#
# Shell syntax: KEY=value, no spaces around `=`.
# Edits to CACHE_KEEPALIVE, CACHE_TTL, CACHE_REFRESH_AT, CACHE_MAX_TOUCHES, CACHE_MIN_TOKENS,
# and CACHE_MODELS take effect live on the next 15s statusline tick without restarting agy.
# Environment variables prefixed with AGY_ (e.g. AGY_CACHE_KEEPALIVE=off) override this file.

# Start the per-session loopback relay in hub-wrapper.sh (on | off).
# Tracks exact main-session upstream prefill times so subagents never reset the countdown.
CACHE_RELAY=on

# Replay the last main-session request before the implicit cache expires (on | off).
# Set to `off` to keep the truthful TTL countdown in the status line without sending replays.
CACHE_KEEPALIVE=on

# Upstream implicit prompt-cache lifetime (`300`, `300s`, `5m`, `4m30s`).
CACHE_TTL=5m

# Elapsed idle time at which statusline.sh triggers a keepalive touch (`270`, `270s`, `4m30s`).
# With the 15s idle statusline tick, `4m30s` fires between 4m30s and 4m45s, leaving a 15-30s
# buffer before the 5m cliff.
CACHE_REFRESH_AT=4m30s

# Maximum consecutive idle touches before letting the cache cool (`0` disables touches).
# Four touches at 4m30s cover ~23 minutes of idle time; any real user turn resets the count.
CACHE_MAX_TOUCHES=4

# Minimum prompt size (input + cache_read tokens) worth keeping warm.
CACHE_MIN_TOKENS=32000

# Comma-separated model substrings eligible for keepalive touches.
CACHE_MODELS=argon,carbon,hydrogen
