# ~/.gemini/antigravity-cli/agy-neo.conf
#
# Prompt-cache keepalive policy for agy-neo (hub-wrapper.sh, native modelapiccpa, statusline.sh).
# Installed once by `python3 patch_agy.py --apply` and never overwritten on later applies.
#
# Shell syntax: KEY=value, no spaces around `=`.
# Environment variables prefixed with AGY_ (e.g. AGY_CACHE_KEEPALIVE=off, AGY_CACHE_MAX_TOUCHES=0)
# override this file. CACHE_TTL and CACHE_KEEPALIVE display settings reload live in statusline.sh;
# CACHE_MAX_TOUCHES is read when a session starts (or live per turn via AGY_CACHE_MAX_TOUCHES).

# Enable native modelapiccpa.(*keepAlives) touches (on | off).
# Fires in-process at Google's native 4m30s idle mark with MaxOutputTokens=1 and stops
# automatically if an upstream touch misses cache (`CacheRead <= Input + CacheWrite`).
CACHE_KEEPALIVE=on

# Upstream implicit prompt-cache lifetime displayed in statusline.sh (`300`, `300s`, `5m`).
CACHE_TTL=5m

# Maximum consecutive idle touches per turn before letting the cache cool (`0` disables touches).
# Four touches at 4m30s cover ~23 minutes of idle time; any real user turn resets the count.
CACHE_MAX_TOUCHES=4

# Auto-compaction threshold exported as AGY_CLI_AUTO_COMPACT_OVERRIDE by hub-wrapper.sh
# and used as the context percentage denominator in statusline.sh.
# Accepts token counts (700000), K/M shorthand (512K, 0.5M), percentages (80%), or off/empty
# for the server default. Explicit AGY_CLI_AUTO_COMPACT_OVERRIDE in the environment wins.
AUTO_COMPACT_WINDOW=512K
